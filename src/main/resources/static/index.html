<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtra-vision</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="header-top">
            <img src="logo.png" alt="Xtra-vision Logo" class="logo">
            <div class="search-bar">
                <input type="text" placeholder="Search entire store here...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
        <nav>
            <a href="#movies">DVD & Blu-Ray</a>
            <a href="#games">Games</a>
            <a href="#electronics">Electronics</a>
            <a href="#music">Music</a>
            <div class="social-icons">
                <img src="socials/facebook.png" alt="Facebook Logo">
                <img src="socials/twitter.png" alt="Twitter Logo">
                <img src="socials/youtube.png" alt="YouTube Logo">
            </div>
        </nav>
    </header>

    <div class="hero">
        <div class="pass-container">


            <div class="terms">

            </div>
        </div>
    </div>

    <footer>
        <p>Xtra-vision name, design and related marks are registered. Xtra-vision Ltd. registered in Ireland. No. 74594.
            Registered Office Greenhills Road, Tallaght, Dublin 24.<br>
            © 2013 Xtra-vision </p>
        <p style="margin-top: 10px; font-size: 14px;"> Ecommerce Designer | Hosting </p>
    </footer>
</body>

</html>
